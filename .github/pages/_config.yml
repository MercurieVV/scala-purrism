# Jekyll configuration for the published documentation site.
#
# Kept here rather than in `docs/` because mdoc copies everything it finds in
# its input directory to its output directory, and rather than in `website/`
# because that directory is generated -- `mill docs.run` writes it and
# `.gitignore` excludes it. The Pages workflow copies this file into the
# rendered site before Jekyll runs.
title: scala-purrism
description: Scalafix semantic rules for refactoring Typelevel Scala toward pure, polymorphic Cats style.
theme: jekyll-theme-cayman

# A project site is served from a subpath, and every internal link is written
# by `relative_url`, so this has to be right or each one 404s at the domain
# root. `actions/configure-pages` would infer it, but only into a `_config.yml`
# at the repository root -- the rendered site's config lives in `website/docs`,
# which that action does not look at.
url: https://mercurievv.github.io
baseurl: /scala-purrism

# The pages carry no front matter, so nothing assigns them a layout and the
# theme goes unused -- markdown converted to bare HTML with no stylesheet.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Both ship with the github-pages gem and both are load-bearing here.
#
# `jekyll-optional-front-matter` is what makes these pages render at all:
# Jekyll treats a file without front matter as a static asset and copies it
# through untouched, so the site would serve raw `index.md` -- verified by
# building without this plugin, which produced exactly that.
#
# `jekyll-relative-links` rewrites the `RULES.md` style links to `.html`. They
# are written that way so the same files stay readable in the repository.
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false
